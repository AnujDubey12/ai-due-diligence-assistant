<div class="container mt-5">

  <div class="card shadow">

    <div class="card-header">
      <h3>AI Due Diligence Assistant</h3>
    </div>

    <div class="card-body">

      <label class="form-label">
        Ask a Due Diligence Question
      </label>

      <textarea
        class="form-control"
        rows="4"
        [(ngModel)]="question">
      </textarea>

      <button
        class="btn btn-primary mt-3"
        (click)="askQuestion()">

        Ask AI

      </button>

      @if (loading)
      {
        <div class="mt-3">
          Generating response...
        </div>
      }

      @if (response)
      {
        <div class="alert alert-secondary mt-4">

          <h5>Response</h5>

          <pre style="white-space: pre-wrap;">{{ response }}</pre>

        </div>
      }

    </div>

  </div>

</div>
